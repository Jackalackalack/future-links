const FONT_HREF = "https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap";

const PASSPHRASE = "badjazz1929";
let UNLOCKED = false;
try { UNLOCKED = localStorage.getItem("crateUnlocked") === "1"; } catch (e) {}

let READ_ONLY = false;
let STATIC_MIRROR = false;
let _apiPromise = null;
function getArtifactApi() {
  if (!_apiPromise) {
    _apiPromise = (window.claude && typeof window.claude.use === "function")
      ? window.claude.use("artifact").catch(() => null)
      : Promise.resolve(null);
  }
  return _apiPromise;
}
getArtifactApi().then(function (api) { if (!api) STATIC_MIRROR = true; });

const UI = { query: "", activeTags: new Set(), manage: false, formMode: null, editingId: null, formTagSel: new Set(), formDraft: { url: "", title: "", note: "" }, showArchive: false };

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function domainOf(url) {
  try { return new URL(url).hostname.replace(/^www\./, ""); } catch (e) { return url; }
}
function pad2(n) { return String(n).length < 2 ? "0" + n : String(n); }
function sectorCodes(state) {
  const map = {};
  state.links.forEach(function (l, i) { map[l.id] = "SEC-" + pad2(i + 1); });
  return map;
}
function todayStamp() {
  const d = new Date();
  return d.getFullYear() + "." + pad2(d.getMonth() + 1) + "." + pad2(d.getDate());
}
function tagCounts(state) {
  const counts = {};
  state.tags.forEach(function (t) { counts[t] = 0; });
  state.links.forEach(function (l) { l.tags.forEach(function (t) { counts[t] = (counts[t] || 0) + 1; }); });
  return counts;
}
function filteredLinks(state, ui) {
  const terms = ui.query.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const active = ui.activeTags;
  return state.links.filter(function (l) {
    if (active.size) {
      const hit = l.tags.some(function (t) { return active.has(t); });
      if (!hit) return false;
    }
    if (!terms.length) return true;
    const hay = (l.title + " " + l.url + " " + (l.note || "") + " " + l.tags.join(" ")).toLowerCase();
    return terms.every(function (term) { return hay.indexOf(term) !== -1; });
  }).slice().sort(function (a, b) {
    return (b.added || "").localeCompare(a.added || "") || a.title.localeCompare(b.title);
  });
}
function relatedLinks(link, allLinks, limit) {
  return allLinks
    .filter(function (o) { return o.id !== link.id; })
    .map(function (o) {
      const shared = o.tags.filter(function (t) { return link.tags.indexOf(t) !== -1; }).length;
      return { link: o, shared: shared };
    })
    .filter(function (x) { return x.shared > 0; })
    .sort(function (a, b) { return b.shared - a.shared || b.link.added.localeCompare(a.link.added); })
    .slice(0, limit)
    .map(function (x) { return x.link; });
}

function renderTagShelf(state, ui) {
  const counts = tagCounts(state);
  return state.tags.slice().sort(function (a, b) { return a.localeCompare(b); }).map(function (t) {
    const active = ui.activeTags.has(t);
    const n = counts[t] || 0;
    const dim = n === 0 && !active ? " is-dim" : "";
    return '<button type="button" class="tag-pill' + (active ? " is-active" : "") + dim + '" data-tag="' + esc(t) + '">'
      + esc(t) + ' <span class="n">' + n + "</span></button>";
  }).join("");
}

function renderCard(l, ui, codes, allLinks) {
  const manageBtns = ui.manage
    ? '<div class="card-actions">'
      + '<button type="button" class="icon-btn" data-edit="' + esc(l.id) + '" title="Edit" aria-label="Edit link">✎</button>'
      + '<button type="button" class="icon-btn danger" data-delete="' + esc(l.id) + '" title="Delete" aria-label="Delete link">✕</button>'
      + "</div>"
    : "";
  const tagsHtml = l.tags.map(function (t) {
    return '<button type="button" class="card-tag" data-tag="' + esc(t) + '">' + esc(t) + "</button>";
  }).join("");
  const rel = relatedLinks(l, allLinks, 3);
  const relatedHtml = rel.length
    ? '<div class="related"><p class="related-label caps">connected sheets</p>'
      + rel.map(function (r) {
          return '<button type="button" class="related-item" data-jumpto="' + esc(r.id) + '"><span class="rt">' + esc(r.title) + "</span></button>";
        }).join("")
      + "</div>"
    : "";
  return '<article class="card frame">'
    + '<div class="card-top"><span class="card-eyebrow">' + esc(codes[l.id] || "") + " · " + esc(domainOf(l.url)) + "</span>" + manageBtns + "</div>"
    + '<a class="card-title" href="' + esc(l.url) + '" target="_blank" rel="noopener noreferrer">' + esc(l.title) + "</a>"
    + (l.note ? '<p class="card-note">' + esc(l.note) + "</p>" : "")
    + '<div class="card-tags">' + tagsHtml + "</div>"
    + '<div class="card-foot"><span>ADDED ' + esc(l.added || "") + "</span></div>"
    + relatedHtml
    + "</article>";
}

function renderForm(state, ui) {
  const editing = ui.formMode === "edit" ? state.links.find(function (l) { return l.id === ui.editingId; }) : null;
  const heading = editing ? "EDIT SUBMISSION — " + esc(editing.title) : "NEW SUBMISSION";
  const urlVal = esc(ui.formDraft.url);
  const titleVal = esc(ui.formDraft.title);
  const noteVal = esc(ui.formDraft.note);
  const allTags = state.tags.slice().sort(function (a, b) { return a.localeCompare(b); });
  const pickerHtml = allTags.map(function (t) {
    const on = ui.formTagSel.has(t);
    return '<button type="button" class="tag-pill' + (on ? " is-active" : "") + '" data-formtag="' + esc(t) + '">' + esc(t) + "</button>";
  }).join("");
  return '<div class="form-panel frame"><h2 class="caps">' + heading + '</h2>'
    + '<div class="form-grid">'
    + '<div class="form-field span2"><label class="caps">Link URL</label><input id="f-url" type="text" placeholder="https://example.com/article" value="' + urlVal + '"></div>'
    + '<div class="form-field span2"><label class="caps">Title</label><input id="f-title" type="text" placeholder="What is this?" value="' + titleVal + '"></div>'
    + '<div class="form-field span2"><label class="caps">Note (optional)</label><textarea id="f-note" rows="2" placeholder="A line on why it is worth reading">' + noteVal + "</textarea></div>"
    + '<div class="form-field span2"><label class="caps">Tags</label><div class="tagpicker">' + pickerHtml + "</div>"
    + '<div class="newtag-row"><input id="f-newtag" type="text" placeholder="Create a new tag…"><button type="button" class="btn" id="f-newtag-add">Add tag</button></div>'
    + "</div>"
    + "</div>"
    + '<div class="form-actions"><button type="button" class="btn" id="f-cancel">Discard</button><button type="button" class="btn primary" id="f-save">' + (editing ? "Save changes" : "Submit link") + "</button></div>"
    + "</div>";
}

function renderApp(state, ui) {
  const list = filteredLinks(state, ui);
  const hasFilter = ui.query.trim() !== "" || ui.activeTags.size > 0;
  const showingGrid = hasFilter || ui.showArchive || ui.manage;
  const codes = sectorCodes(state);
  let gridHtml;
  if (!showingGrid) {
    gridHtml = '<div class="archive-prompt"><button type="button" class="archive-link" data-archive-toggle="1">See full archive (' + state.links.length + ')</button></div>';
  } else if (list.length) {
    gridHtml = list.map(function (l) { return renderCard(l, ui, codes, state.links); }).join("");
  } else {
    gridHtml = '<div class="empty-state">No sheets match this query.' + (hasFilter ? ' <button type="button" class="clear-link" id="clear-filters-2">Clear filters</button>' : "") + "</div>";
  }

  const statusRow = READ_ONLY
    ? '<div class="tb-row status-ro"><span>ACCESS</span><b>READ-ONLY</b></div>'
    : '<div class="tb-row status-live"><span>ACCESS</span><b>EDITABLE</b></div>';

  return '<div class="sheet">'
    + '<span class="reg reg-tl"></span><span class="reg reg-tr"></span><span class="reg reg-bl"></span><span class="reg reg-br"></span>'
    + '<div class="header">'
    + '<div><p class="kicker caps">master index — searchable link library</p><h1 class="brand">FUTURE LINKS</h1>'
    + '<p class="tagline">A shared stash of links for the course. Search by inputting your own search term or filter by tag.</p></div>'
    + '<div style="display:flex; flex-direction:column; align-items:flex-end; gap:10px;">'
    + '<div class="readout"><div>SHEET 1/1 · REV ' + pad2(state.rev) + "</div><div>PLOTTED " + todayStamp() + "</div></div>"
    + '<button type="button" class="manage-btn caps' + (ui.manage ? " is-on" : "") + '" id="manage-toggle">' + (ui.manage ? "Done" : "Submit") + "</button>"
    + "</div>"
    + "</div>"
    + (ui.manage ? '<div style="margin-bottom:14px;"><button type="button" class="btn primary caps" id="add-open">+ New submission</button></div>' : "")
    + (ui.formMode ? renderForm(state, ui) : "")
    + '<div class="searchwrap frame"><p class="field-label caps">query</p><input id="q" class="search-input" type="text" placeholder="Search titles, notes, tags…" value="' + esc(ui.query) + '" autocomplete="off"></div>'
    + (showingGrid
        ? '<div class="meta-row"><span>' + list.length + " OF " + state.links.length + " SHEETS SHOWN" + "</span>"
          + (hasFilter ? '<button type="button" class="clear-link" id="clear-filters">Clear filters</button>' : (ui.manage ? "" : '<button type="button" class="archive-link" data-archive-toggle="1">Hide full archive</button>'))
          + "</div>"
        : "")
    + '<div class="legend frame"><p class="field-label caps">legend — click a tag to filter</p><div class="tagshelf">' + renderTagShelf(state, ui) + "</div></div>"
    + '<div class="grid">' + gridHtml + "</div>"
    + '<div class="titleblock frame">'
    + '<div class="tb-name">FUTURE LINKS — LINK INDEX</div>'
    + '<div class="tb-row"><span>TAGS</span><b>' + state.tags.length + '</b></div>'
    + '<div class="tb-row"><span>SHEETS</span><b>' + state.links.length + '</b></div>'
    + statusRow
    + "</div>"
    + '<footer class="site-credit">Built by <a href="https://jackabraham.studio" target="_blank" rel="noopener">Jack Abraham</a><span class="credit-sep">&middot;</span><a href="https://github.com/Jackalackalack" target="_blank" rel="noopener">GitHub</a><span class="credit-sep">&middot;</span><a href="https://www.linkedin.com/in/jackcabraham/" target="_blank" rel="noopener">LinkedIn</a></footer>'
    + "</div>";
}

let toastTimer = null;
function showToast(msg, type) {
  const el = document.getElementById("toast");
  if (!el) return;
  el.textContent = msg;
  el.className = "toast" + (type === "error" ? " error" : "");
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.hidden = true; }, 3200);
}

function rerender() {
  const app = document.getElementById("app");
  const active = document.activeElement;
  const isSearch = active && active.id === "q";
  const selStart = isSearch ? active.selectionStart : null;
  const selEnd = isSearch ? active.selectionEnd : null;
  app.innerHTML = renderApp(STATE, UI);
  bind();
  if (isSearch) {
    const el = document.getElementById("q");
    if (el) { el.focus(); try { el.setSelectionRange(selStart, selEnd); } catch (e) {} }
  }
}

function toggleSetVal(set, val) {
  if (set.has(val)) set.delete(val); else set.add(val);
}

function proceedManageToggle() {
  UI.manage = !UI.manage;
  if (UI.manage) {
    UI.formMode = "add"; UI.editingId = null; UI.formTagSel = new Set();
    UI.formDraft = { url: "", title: "", note: "" };
  } else {
    UI.formMode = null;
  }
  rerender();
}

function openGate(onSuccess) {
  const gate = document.getElementById("gate");
  const input = document.getElementById("gate-input");
  const err = document.getElementById("gate-error");
  if (!gate || !input) { onSuccess(); return; }
  gate.hidden = false;
  if (err) err.hidden = true;
  input.value = "";
  gate._onSuccess = onSuccess;
  setTimeout(function () { input.focus(); }, 30);
}

function bind() {
  const app = document.getElementById("app");

  const q = document.getElementById("q");
  if (q) q.addEventListener("input", function () { UI.query = q.value; rerender(); });

  app.querySelectorAll("[data-tag]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      toggleSetVal(UI.activeTags, btn.getAttribute("data-tag"));
      rerender();
    });
  });

  ["clear-filters", "clear-filters-2"].forEach(function (id) {
    const el = document.getElementById(id);
    if (el) el.addEventListener("click", function () { UI.query = ""; UI.activeTags = new Set(); rerender(); });
  });

  app.querySelectorAll("[data-archive-toggle]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      UI.showArchive = !UI.showArchive;
      rerender();
    });
  });

  const manageToggle = document.getElementById("manage-toggle");
  if (manageToggle) manageToggle.addEventListener("click", function () {
    if (STATIC_MIRROR) {
      showToast("This is a static, read-only mirror — add or edit links on the live Claude version instead.", "error");
      return;
    }
    if (!UI.manage && !UNLOCKED) {
      openGate(proceedManageToggle);
      return;
    }
    proceedManageToggle();
  });

  const addOpen = document.getElementById("add-open");
  if (addOpen) addOpen.addEventListener("click", function () {
    UI.formMode = "add"; UI.editingId = null; UI.formTagSel = new Set();
    UI.formDraft = { url: "", title: "", note: "" };
    rerender();
  });

  app.querySelectorAll("[data-edit]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      const id = btn.getAttribute("data-edit");
      const link = STATE.links.find(function (l) { return l.id === id; });
      UI.formMode = "edit"; UI.editingId = id; UI.formTagSel = new Set(link ? link.tags : []);
      UI.formDraft = { url: link ? link.url : "", title: link ? link.title : "", note: link ? (link.note || "") : "" };
      rerender();
    });
  });

  app.querySelectorAll("[data-delete]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      const id = btn.getAttribute("data-delete");
      const link = STATE.links.find(function (l) { return l.id === id; });
      if (!link) return;
      if (!window.confirm('Delete "' + link.title + '"?')) return;
      STATE.links = STATE.links.filter(function (l) { return l.id !== id; });
      STATE.rev += 1;
      rerender();
      persist();
    });
  });

  app.querySelectorAll("[data-formtag]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      toggleSetVal(UI.formTagSel, btn.getAttribute("data-formtag"));
      rerender();
    });
  });

  app.querySelectorAll("[data-jumpto]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      const id = btn.getAttribute("data-jumpto");
      const link = STATE.links.find(function (l) { return l.id === id; });
      if (!link) return;
      UI.query = link.title;
      UI.activeTags = new Set();
      rerender();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  });

  const fUrl = document.getElementById("f-url");
  const fTitle = document.getElementById("f-title");
  const fNote = document.getElementById("f-note");
  if (fUrl) fUrl.addEventListener("input", function () { UI.formDraft.url = fUrl.value; });
  if (fTitle) fTitle.addEventListener("input", function () { UI.formDraft.title = fTitle.value; });
  if (fNote) fNote.addEventListener("input", function () { UI.formDraft.note = fNote.value; });

  const newTagAdd = document.getElementById("f-newtag-add");
  const newTagInput = document.getElementById("f-newtag");
  function addDraftTag() {
    if (!newTagInput) return;
    const raw = newTagInput.value.trim();
    if (!raw) return;
    const existing = STATE.tags.find(function (t) { return t.toLowerCase() === raw.toLowerCase(); });
    const finalTag = existing || raw;
    if (!existing) { STATE.tags.push(finalTag); }
    UI.formTagSel.add(finalTag);
    rerender();
  }
  if (newTagAdd) newTagAdd.addEventListener("click", addDraftTag);
  if (newTagInput) newTagInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); addDraftTag(); }
  });

  const cancelBtn = document.getElementById("f-cancel");
  if (cancelBtn) cancelBtn.addEventListener("click", function () {
    UI.formMode = null; UI.editingId = null; rerender();
  });

  const saveBtn = document.getElementById("f-save");
  if (saveBtn) saveBtn.addEventListener("click", saveLink);
}

function saveLink() {
  const urlField = document.getElementById("f-url");
  const titleField = document.getElementById("f-title");
  const noteField = document.getElementById("f-note");
  const url = urlField ? urlField.value.trim() : "";
  const title = titleField ? titleField.value.trim() : "";
  const note = noteField ? noteField.value.trim() : "";
  if (!url || !title) { showToast("A link needs at least a URL and a title.", "error"); return; }
  let normalizedUrl = url;
  if (!/^https?:\/\//i.test(normalizedUrl)) normalizedUrl = "https://" + normalizedUrl;
  const tags = Array.from(UI.formTagSel);
  const now = new Date().toISOString().slice(0, 10);

  if (UI.formMode === "edit" && UI.editingId) {
    const link = STATE.links.find(function (l) { return l.id === UI.editingId; });
    if (link) { link.url = normalizedUrl; link.title = title; link.note = note; link.tags = tags; }
  } else {
    STATE.links.unshift({
      id: "l" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      url: normalizedUrl, title: title, note: note, tags: tags, added: now
    });
  }
  STATE.rev += 1;
  UI.formMode = null; UI.editingId = null;
  rerender();
  persist();
}

}

async function persist() {
  if (READ_ONLY) return;
  const api = await getArtifactApi();
  if (!api) return;
  try {
    await api.publish(buildFullDocument());
    showToast("Saved");
  } catch (err) {
    const code = err && err.code;
    if (code === "not_writer" || code === "not_granted" || code === "consent_required") {
      READ_ONLY = true;
      UI.manage = false; UI.formMode = null;
      rerender();
      showToast("You're viewing in read-only mode — ask the page owner to add or edit links.", "error");
    } else if (code === "conflict") {
      showToast("Updated elsewhere — refreshing…");
    } else if (code === "too_large") {
      showToast("This index is too large to save more — remove a few links first.", "error");
    } else {
      showToast("Could not save — try again in a moment.", "error");
    }
  }
}

rerender();

(function () {
  const btn = document.getElementById("creatorTagBtn");
  const panel = document.getElementById("creatorPanel");
  const closeBtn = document.getElementById("creatorPanelClose");
  if (!btn || !panel || !closeBtn) return;
  function setOpen(open) {
    panel.classList.toggle("open", open);
    panel.setAttribute("aria-hidden", String(!open));
    btn.setAttribute("aria-expanded", String(open));
  }
  btn.addEventListener("click", function () { setOpen(!panel.classList.contains("open")); });
  closeBtn.addEventListener("click", function () { setOpen(false); });
  document.addEventListener("click", function (e) {
    if (panel.classList.contains("open") && !panel.contains(e.target) && e.target !== btn) setOpen(false);
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") setOpen(false); });
})();

(function () {
  const gate = document.getElementById("gate");
  const input = document.getElementById("gate-input");
  const err = document.getElementById("gate-error");
  const okBtn = document.getElementById("gate-ok");
  const cancelBtn = document.getElementById("gate-cancel");
  if (!gate || !input || !okBtn || !cancelBtn) return;
  function attempt() {
    if (input.value === PASSPHRASE) {
      UNLOCKED = true;
      try { localStorage.setItem("crateUnlocked", "1"); } catch (e) {}
      const cb = gate._onSuccess;
      gate.hidden = true;
      if (cb) cb();
    } else {
      if (err) err.hidden = false;
      input.value = "";
      input.focus();
    }
  }
  okBtn.addEventListener("click", attempt);
  cancelBtn.addEventListener("click", function () { gate.hidden = true; });
  input.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); attempt(); } });
  gate.addEventListener("click", function (e) { if (e.target === gate) gate.hidden = true; });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !gate.hidden) gate.hidden = true; });
})();
</script>
